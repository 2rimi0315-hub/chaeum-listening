<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>채움 듣기·기억 중재</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5faf8;color:#24473f;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}header{background:#e1f1e9;padding:22px}header h1{margin:0}header p{color:#608478;margin:7px 0 0}main{max-width:870px;margin:auto;padding:16px}.card{background:white;border:1px solid #d4e5dc;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #1235270c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button{border:1px solid #bed7ca;background:white;color:#235548;border-radius:12px;min-height:48px;padding:10px 17px;font:inherit;font-weight:700;cursor:pointer}button.on,button.primary{background:#347f69;color:white;border-color:#347f69}button:disabled{opacity:.4}select,input,textarea{font:inherit;background:white;border:1px solid #bad3c6;border-radius:10px;padding:11px}textarea{width:100%;min-height:80px}label{display:block;font-weight:700;margin:10px 0 7px}.stim{background:#eaf6f0;border-radius:15px;padding:26px 15px;text-align:center;min-height:170px;font-size:clamp(22px,3vw,32px);line-height:1.6;display:flex;align-items:center;justify-content:center}.question{font-size:clamp(19px,2.5vw,26px);font-weight:750;line-height:1.5;margin:16px 0}.muted{color:#648478;font-size:14px}.hide{display:none!important}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scores button{padding:11px 5px}.scores .selected{outline:3px solid #65af90;background:#e9f6ef;color:#235548}.info{background:#f0f7f3;padding:14px;border-radius:12px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#eaf6f0;padding:13px 3px;border-radius:13px}.stat strong{display:block;font-size:29px}.line{border-bottom:1px solid #e1ede6;padding:9px 0}.foot{text-align:center;color:#779487;font-size:12px;padding:20px}@media(max-width:530px){main{padding:9px}.card{padding:12px}button{padding:9px}.scores{gap:5px}}</style></head><body><header><h1>채움 듣기·기억 중재</h1><p>문장 따라 말하기 · 이야기 듣기 · 정오반응 기록 · 보호자 상담</p></header><main>
<div class="card row"><button id="tabL" class="on" onclick="view('lesson')">수업·채점</button><button id="tabR" onclick="view('report')">결과·상담</button><span class="muted" id="progress"></span></div>
<section id="lesson"><div class="card"><div class="row"><button id="memBtn" class="on" onclick="changeMode('memory')">① 문장 기억</button><button id="storyBtn" onclick="changeMode('story')">② 이야기 듣기</button><select id="level" onchange="changeLevel(this.value)"><option value="1">1단계</option><option value="2">2단계</option><option value="3">3단계</option></select></div></div>
<div class="card"><div class="row between"><h2 id="title"></h2><span class="muted" id="position"></span></div><div class="stim" id="stimulus"></div><div class="row" style="margin-top:13px"><button id="cover" onclick="toggle('covered')">지문 가리기</button><button onclick="toggle('hints')">힌트</button><button onclick="toggle('answers')">정답</button></div><div class="question" id="question"></div><div class="info hide" id="hint"></div><div class="info hide" id="answer"></div></div>
<div class="card"><h2>정오반응 체크</h2><div class="scores"><button data-score="O" onclick="score('O')">O 정반응<br><small>독립</small></button><button data-score="△" onclick="score('△')">△ 단서 후<br><small>도움받아 성공</small></button><button data-score="X" onclick="score('X')">X 오반응<br><small>어려움</small></button></div><label>문항별 관찰 메모</label><textarea id="note" oninput="note(this.value)" placeholder="예: 핵심어 1개 누락, 2회 재청취 후 정반응"></textarea><div class="row between" style="margin-top:12px"><button id="prev" onclick="move(-1)">← 이전</button><button id="next" class="primary" onclick="move(1)">다음 →</button></div></div></section>
<section id="report" class="hide"><div class="card"><h2>수업 결과 요약</h2><label>수업 날짜</label><input id="date" type="date" onchange="saveReport()"><div class="stats" id="stats" style="margin:14px 0"></div><div id="breakdown"></div></div><div class="card"><h2>단서 제공 및 오반응 문항</h2><div id="errors"></div></div><div class="card"><label>치료사 관찰</label><textarea id="observation" oninput="saveReport()" placeholder="문장 길이, 정보 누락, 도움의 정도"></textarea><label>보호자 상담 메모</label><textarea id="consult" oninput="saveReport()" placeholder="오늘의 수행 특성 및 다음 수업 목표"></textarea><div class="row"><button class="primary" onclick="copyResult()">상담 기록 복사</button><button onclick="downloadResult()">TXT 파일 저장</button></div><p class="muted" id="status"></p><p class="muted">기록은 사용 중인 브라우저의 로컬 저장소에 보관됩니다. 다른 패드와 자동 동기화되지 않습니다. 개인정보 노출을 줄이기 위해 공개 사이트에 아동 실명은 사용하지 마세요. 수업 후 기록을 따로 보관하세요.</p></div></section><div class="foot">채움언어학습연구소</div></main>
<script>const M=[["1", "민수가 물을 마셨어요."], ["1", "지우가 책을 읽었어요."], ["1", "동생이 공을 던졌어요."], ["1", "엄마가 사과를 깎았어요."], ["1", "아빠가 자동차를 씻었어요."], ["1", "민수가 학교에 갔어요."], ["2", "민수가 운동장에서 축구를 했어요."], ["2", "지우가 도서관에서 책을 빌렸어요."], ["2", "동생이 아침에 우유를 마셨어요."], ["2", "엄마가 시장에서 딸기를 샀어요."], ["2", "선생님이 칠판에 문제를 쓰셨어요."], ["2", "민수가 어제 친구에게 전화를 했어요."], ["3", "비가 와서 민수는 우산을 썼어요."], ["3", "지우는 숙제를 끝내고 텔레비전을 봤어요."], ["3", "동생은 배가 고파서 빵을 먹었어요."], ["3", "민수는 도서관에 갔지만 문이 닫혀 있었어요."], ["3", "엄마가 만든 김밥을 동생과 함께 먹었어요."], ["3", "지우는 비가 그친 뒤에 친구와 산책했어요."]],S=[["1", "잃어버린 연필", "민수가 연필을 잃어버렸어요. 친구가 연필을 빌려주었어요.", [["무엇을 잃어버렸나요?", "연필", "연필 / 지우개"], ["누가 연필을 빌려주었나요?", "친구", "친구 / 선생님"], ["친구는 어떻게 도와주었나요?", "연필을 빌려주었어요.", "빌려줌 / 가져감"]]], ["1", "비 오는 날", "아침부터 비가 내렸어요. 지우는 우산을 쓰고 학교에 갔어요.", [["날씨가 어땠나요?", "비가 왔어요.", "비 / 눈"], ["무엇을 썼나요?", "우산", "우산 / 모자"], ["어디에 갔나요?", "학교", "학교 / 공원"]]], ["1", "간식 시간", "동생은 배가 고팠어요. 엄마가 동생에게 빵을 주었어요.", [["누가 배가 고팠나요?", "동생", "동생 / 엄마"], ["엄마가 준 것은 무엇인가요?", "빵", "빵 / 우유"], ["엄마는 왜 빵을 주었나요?", "동생이 배가 고팠기 때문이에요.", "배고픔 / 졸림"]]], ["2", "늦은 등교", "민수는 아침에 늦게 일어났어요. 그래서 서둘러 준비했지만 학교에 늦었어요.", [["언제 늦게 일어났나요?", "아침", "아침 / 저녁"], ["왜 서둘러 준비했나요?", "늦게 일어났기 때문이에요.", "늦잠 / 운동"], ["결국 어떤 일이 생겼나요?", "학교에 늦었어요.", "지각 / 일찍 도착"]]], ["2", "도서관 방문", "지우는 책을 빌리려고 도서관에 갔어요. 하지만 도서관이 쉬는 날이라 책을 빌리지 못했어요.", [["어디에 갔나요?", "도서관", "도서관 / 서점"], ["왜 도서관에 갔나요?", "책을 빌리려고요.", "책 빌리기 / 친구 만나기"], ["왜 책을 빌리지 못했나요?", "도서관이 쉬는 날이었기 때문이에요.", "휴관 / 책이 없음"]]], ["2", "친구의 생일", "오늘은 서아의 생일이에요. 친구들은 서아에게 깜짝 선물을 주었고 서아는 기뻐했어요.", [["누구의 생일인가요?", "서아", "서아 / 민수"], ["친구들은 무엇을 주었나요?", "선물", "선물 / 숙제"], ["왜 기뻐했나요?", "친구들에게 선물을 받았기 때문이에요.", "선물 받음 / 혼남"]]], ["3", "체육 수업", "민수는 체육 시간에 공을 차다가 넘어졌어요. 무릎이 아파서 보건실에 갔고 선생님께 치료를 받았어요.", [["무엇을 하다가 넘어졌나요?", "공을 차다가요.", "공 차기 / 줄넘기"], ["왜 보건실에 갔나요?", "무릎이 아팠기 때문이에요.", "무릎 통증 / 배고픔"], ["일어난 일을 순서대로 말해 보세요.", "넘어짐 → 무릎이 아픔 → 보건실에서 치료받음", "넘어짐 / 보건실 / 치료"]]], ["3", "새로운 전학생", "우리 반에 새로운 전학생이 왔어요. 처음에는 친구가 없어 혼자 있었지만, 지우가 먼저 말을 걸어주어 함께 놀게 되었어요.", [["누가 왔나요?", "전학생", "전학생 / 선생님"], ["왜 혼자 있었나요?", "친구가 없었기 때문이에요.", "친구가 없음 / 다침"], ["상황이 어떻게 바뀌었나요?", "지우가 말을 걸어 함께 놀게 되었어요.", "혼자 → 대화 → 같이 놂"]]], ["3", "소풍 준비", "내일은 학교 소풍이 있는 날이에요. 민수는 도시락과 물을 미리 챙겼지만 아침에 비가 많이 내려 소풍이 취소되었어요.", [["무엇을 준비했나요?", "도시락과 물", "도시락과 물 / 우산과 책"], ["왜 소풍이 취소되었나요?", "비가 많이 내렸기 때문이에요.", "비 / 버스 고장"], ["민수는 어떤 기분일까요? 이유는?", "아쉬울 것 같아요. 소풍이 취소되었기 때문이에요.", "아쉬움 / 기쁨"]]]];const storage='chaeum-listening-v1';let db;try{db=JSON.parse(localStorage.getItem(storage)||'{}')}catch(e){db={}}db.scores=db.scores||{};db.notes=db.notes||{};let mode='memory',level='1',i=0,q=0,covered=false,hints=false,answers=false;
function persist(){try{localStorage.setItem(storage,JSON.stringify(db))}catch(e){document.getElementById('status').textContent='기기 저장이 제한되어 있습니다. TXT 파일로 보관하세요.'}}
function dataset(){return mode==='memory'?M.map((a,k)=>({id:k,lv:a[0],body:a[1]})).filter(a=>a.lv===level):S.map((a,k)=>({id:k,lv:a[0],title:a[1],body:a[2],questions:a[3]})).filter(a=>a.lv===level)}function cur(){return dataset()[i]}function key(){return mode+'-'+cur().id+(mode==='story'?'-'+q:'')}function byId(id){return document.getElementById(id)}function setText(id,s){byId(id).textContent=s}
function reset(){i=0;q=0;covered=false;hints=false;answers=false;render()}function changeMode(m){mode=m;reset()}function changeLevel(l){level=l;reset()}function toggle(k){if(k==='covered')covered=!covered;else if(k==='hints')hints=!hints;else if(k==='answers')answers=!answers;render()}function score(v){db.scores[key()]=db.scores[key()]===v?null:v;persist();render()}function note(s){db.notes[key()]=s;persist()}
function move(d){if(d>0){if(mode==='story'&&q<2)q++;else if(i<dataset().length-1){i++;q=0}else if(level!=='3'){level=String(Number(level)+1);i=0;q=0}}else if(mode==='story'&&q>0)q--;else if(i>0){i--;q=mode==='story'?2:0}covered=hints=answers=false;render()}
function render(){byId('level').value=level;byId('memBtn').classList.toggle('on',mode==='memory');byId('storyBtn').classList.toggle('on',mode==='story');let c=cur();setText('title',mode==='memory'?'문장 '+(c.id+1):c.title);setText('position',(i+1)+' / '+dataset().length+(mode==='story'?' · 질문 '+(q+1)+'/3':''));setText('stimulus',covered?'들은 내용을 기억해서 말해 보세요.':c.body);setText('cover',covered?'지문 다시 보기':'지문 가리기');setText('question',mode==='story'?c.questions[q][0]:'듣고 문장을 그대로 말해 보세요.');setText('hint',mode==='story'?'선택지: '+c.questions[q][2]:'문장의 누가·어디서·무엇을·어떻게 순서로 떠올리도록 도와주세요.');setText('answer',mode==='story'?'예시 정답: '+c.questions[q][1]:'목표 문장: '+c.body);byId('hint').classList.toggle('hide',!hints);byId('answer').classList.toggle('hide',!answers);document.querySelectorAll('[data-score]').forEach(b=>b.classList.toggle('selected',db.scores[key()]===b.dataset.score));byId('note').value=db.notes[key()]||'';byId('prev').disabled=i===0&&q===0;byId('next').disabled=level==='3'&&i===dataset().length-1&&(mode==='memory'||q===2);setText('progress',allEntries().filter(x=>db.scores[x.key]).length+' / 45문항 기록')}
function allEntries(){return [...M.map((a,k)=>({key:'memory-'+k,area:'문장 기억',lv:a[0],label:a[1]})),...S.flatMap((a,k)=>a[3].map((question,j)=>({key:'story-'+k+'-'+j,area:'이야기 듣기',lv:a[0],label:a[1]+' / '+question[0]})))]}function stat(a){let x=a.filter(e=>db.scores[e.key]);let o=x.filter(e=>db.scores[e.key]==='O').length,p=x.filter(e=>db.scores[e.key]==='△').length,wrong=x.filter(e=>db.scores[e.key]==='X').length;return {n:x.length,o,p,wrong,pct:x.length?Math.round(100*o/x.length):null}}
function report(){let entries=allEntries(),lines=['채움 듣기·기억 중재 기록','수업일: '+(db.date||''),''];for(let a of ['전체','문장 기억','이야기 듣기']){let s=stat(a==='전체'?entries:entries.filter(e=>e.area===a));lines.push(a+': 독립 '+s.o+'/'+s.n+' ('+(s.pct===null?'미실시':s.pct+'%')+'), 단서 후 '+s.p+', 오반응 '+s.wrong)}for(let a of ['문장 기억','이야기 듣기'])for(let l of ['1','2','3']){let s=stat(entries.filter(e=>e.area===a&&e.lv===l));lines.push(a+' '+l+'단계: '+s.o+'/'+s.n+' ('+(s.pct===null?'미실시':s.pct+'%')+')')}lines.push('','문항별 반응');for(let e of entries.filter(e=>db.scores[e.key]))lines.push(e.area+' '+e.lv+'단계 · '+e.label+' : '+db.scores[e.key]+(db.notes[e.key]?' / '+db.notes[e.key]:''));lines.push('','수업 관찰: '+(db.observation||''),'보호자 상담: '+(db.consult||''));return lines.join('
')}
function view(v){byId('lesson').classList.toggle('hide',v!=='lesson');byId('report').classList.toggle('hide',v!=='report');byId('tabL').classList.toggle('on',v==='lesson');byId('tabR').classList.toggle('on',v==='report');if(v==='report')renderReport()}
function renderReport(){const all=allEntries(),s=stat(all);byId('stats').innerHTML=[['독립 정반응',s.o],['단서 후',s.p],['오반응',s.wrong]].map(a=>'<div class="stat"><strong>'+a[1]+'</strong>'+a[0]+'</div>').join('');let output='<h2>전체 독립 정반응률 '+(s.pct===null?'미실시':s.pct+'%')+'</h2><p class="muted">실시한 '+s.n+'개 문항 기준, 미실시 문항 제외</p>';for(let area of ['문장 기억','이야기 듣기'])for(let l of ['1','2','3']){let x=stat(all.filter(e=>e.area===area&&e.lv===l));output+='<div class="line">'+area+' '+l+'단계 — 독립 '+x.o+'/'+x.n+' ('+(x.pct===null?'미실시':x.pct+'%')+'), 단서 후 '+x.p+', 오반응 '+x.wrong+'</div>'}byId('breakdown').innerHTML=output;let errors=all.filter(e=>db.scores[e.key]&&db.scores[e.key]!=='O');byId('errors').replaceChildren();if(!errors.length)setText('errors','현재 기록된 단서 후 반응 또는 오반응이 없습니다.');else for(let e of errors){let el=document.createElement('div');el.className='line';el.textContent=db.scores[e.key]+' · '+e.area+' '+e.lv+'단계 — '+e.label+(db.notes[e.key]?' / '+db.notes[e.key]:'');byId('errors').appendChild(el)}byId('date').value=db.date||new Date().toLocaleDateString('sv-SE');byId('observation').value=db.observation||'';byId('consult').value=db.consult||''}
function saveReport(){db.date=byId('date').value;db.observation=byId('observation').value;db.consult=byId('consult').value;persist()}
async function copyResult(){saveReport();try{await navigator.clipboard.writeText(report());setText('status','상담 기록이 복사되었습니다.')}catch(e){setText('status','복사가 차단되었어요. TXT 저장을 이용하세요.')}}function downloadResult(){saveReport();let file=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='채움_상담기록_'+(db.date||'오늘')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();</script></body></html>
